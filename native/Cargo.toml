[package]
name = "keyboard-sound"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Nonblocking keyboard sample playback for Neovim"

[lib]
name = "keyboard_sound"
crate-type = ["cdylib", "rlib"]

[dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["playback", "hound"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
