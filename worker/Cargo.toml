[package]
name = "keyboard-sound-worker"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Persistent keyboard sample playback for Neovim"

[dependencies]
rodio = { version = "0.21.1", default-features = false, features = ["playback", "hound"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
