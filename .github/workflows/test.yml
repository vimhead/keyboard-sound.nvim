name: Tests and release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: libkeyboard_sound.so
            extension: .so
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            library: libkeyboard_sound.so
            extension: .so
          - runner: macos-14
            target: aarch64-apple-darwin
            library: libkeyboard_sound.dylib
            extension: .dylib
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            library: libkeyboard_sound.dylib
            extension: .dylib
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            library: keyboard_sound.dll
            extension: .dll
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - if: matrix.target != 'aarch64-unknown-linux-gnu'
        uses: rhysd/action-setup-vim@v1
        with:
          version: v0.10.4
          neovim: true
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --release --locked --manifest-path native/Cargo.toml
      - if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: |
          for test in run backend installer native; do
            nvim --headless -u NONE -l "tests/$test.lua"
          done
      - name: Test ARM64 library with compatible Neovim runtime
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          docker run --rm -v "$PWD:/plugin:ro" -w /plugin ubuntu:24.04 bash -euc '
            apt-get update
            apt-get install -y curl ca-certificates libasound2t64
            curl --fail --location https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-arm64.tar.gz -o /tmp/nvim.tar.gz
            tar -xzf /tmp/nvim.tar.gz -C /tmp
            export PATH="/tmp/nvim-linux-arm64/bin:$PATH"
            for test in run backend installer native; do
              nvim --headless -u NONE -l "tests/$test.lua"
            done
          '
      - run: |
          mkdir -p dist
          cp "native/target/release/${{ matrix.library }}" "dist/keyboard-sound-${{ matrix.target }}${{ matrix.extension }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open("native/Cargo.toml", "rb") as source:
              version = tomllib.load(source)["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == "v" + version
          PY
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum keyboard-sound-* > SHA256SUMS
      - name: Publish prebuilt libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
